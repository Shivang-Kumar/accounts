services:
 accounts:
  image: "shiv111/accounts:s1"
  container_name: accounts_ms
  ports:
    - "8080:8080"
  deploy:
   resources:
     limits:
       memory: 700m
  networks:
   - eazybank
 loans:
  image: "shiv111/loans:s1"
  container_name: loans_ms
  ports:
   - "8090:8090"
  deploy:
   resources:
     limits:
       memory: 700m
  networks:
   - eazybank
 cards:
   image: "shiv111/cards:s1"
   container_name: cards_ms
   ports:
     - "9000:9000"
   deploy:
    resources:
      limits:
       memory: 700m
   networks:
    - eazybank
networks:
 eazybank:
   driver: bridge
	  
